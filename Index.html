<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVibe | Luxury Lifestyle & Aesthetic Living</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Montserrat:wght@200;300;400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* ============================================
           COSMIC VARIABLES & ROOT DESIGN SYSTEM
           ============================================ */
        :root {
            --champagne: #F7E7CE;
            --soft-rose: #F4C2C2;
            --deep-rose: #C9184A;
            --blush: #FFB6C1;
            --cream: #FFFDD0;
            --ivory: #FFFFF0;
            --gold: #D4AF37;
            --light-gold: #F5E6CC;
            --dark-elegant: #1a1a2e;
            --midnight: #16213e;
            --deep-purple: #2d1b69;
            --lavender: #E6E6FA;
            --soft-white: #faf8f5;
            --warm-gray: #8c8c8c;
            --text-dark: #2c2c2c;
            --glass-white: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --shadow-luxury: 0 25px 60px rgba(0, 0, 0, 0.15);
            --shadow-gold: 0 15px 40px rgba(212, 175, 55, 0.3);
            --shadow-rose: 0 15px 40px rgba(244, 194, 194, 0.4);
            --gradient-luxury: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-rose: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-gold: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            --gradient-sunset: linear-gradient(135deg, #FA8BFF 0%, #2BD2FF 52%, #2BFF88 90%);
            --gradient-dream: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --gradient-ocean: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-warm: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        /* ============================================
           GLOBAL RESET & BASE STYLES
           ============================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) var(--soft-white);
        }

        html::-webkit-scrollbar {
            width: 8px;
        }

        html::-webkit-scrollbar-track {
            background: var(--soft-white);
        }

        html::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--gold), var(--deep-rose));
            border-radius: 10px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--soft-white);
            color: var(--text-dark);
            overflow-x: hidden;
            cursor: default;
        }

        /* ============================================
           CUSTOM CURSOR
           ============================================ */
        .cursor-dot {
            width: 8px;
            height: 8px;
            background: var(--deep-rose);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            transition: transform 0.1s;
            mix-blend-mode: difference;
        }

        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99998;
            transition: all 0.15s ease-out;
            mix-blend-mode: difference;
        }

        .cursor-outline.hover {
            transform: scale(1.8);
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--deep-rose);
        }

        /* ============================================
           PRELOADER
           ============================================ */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-elegant);
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .preloader-logo {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--champagne), var(--gold));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 2s linear infinite;
            margin-bottom: 30px;
        }

        .preloader-bar {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .preloader-bar::after {
            content: '';
            display: block;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--soft-rose), var(--gold));
            border-radius: 10px;
            animation: loadBar 2.5s ease-in-out forwards;
        }

        @keyframes loadBar {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes shimmerText {
            to { background-position: 200% center; }
        }

        .preloader-tagline {
            font-family: 'Dancing Script', cursive;
            color: var(--soft-rose);
            font-size: 1.2rem;
            margin-top: 20px;
            opacity: 0;
            animation: fadeInUp 1s ease 1s forwards;
        }

        /* ============================================
           FLOATING PARTICLES BACKGROUND
           ============================================ */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* ============================================
           NAVIGATION - GLASSMORPHISM
           ============================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            padding: 20px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .navbar.scrolled {
            padding: 12px 60px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 800;
            text-decoration: none;
            background: linear-gradient(135deg, var(--dark-elegant), var(--deep-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            position: relative;
        }

        .navbar.scrolled .nav-logo {
            font-size: 1.7rem;
        }

        .nav-logo .logo-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            margin-left: 2px;
            vertical-align: super;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            padding: 5px 0;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--deep-rose));
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--deep-rose);
        }

        .nav-cta {
            padding: 10px 28px !important;
            background: linear-gradient(135deg, var(--dark-elegant), var(--deep-purple));
            color: white !important;
            border-radius: 50px;
            font-size: 0.8rem !important;
            letter-spacing: 2px;
            transition: all 0.4s ease !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3) !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        /* Mobile Menu Toggle */
        .mobile-toggle {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 10001;
        }

        .mobile-toggle span {
            width: 28px;
            height: 2px;
            background: var(--text-dark);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .mobile-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .mobile-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* ============================================
           HERO SECTION - CINEMATIC
           ============================================ */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
        }

        .hero-bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .hero-bg-animation .floating-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: morphFloat 15s ease-in-out infinite;
        }

        .hero-bg-animation .shape-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201, 24, 74, 0.4), transparent);
            top: -10%;
            right: -5%;
            animation-delay: 0s;
            animation-duration: 20s;
        }

        .hero-bg-animation .shape-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3), transparent);
            bottom: -10%;
            left: -5%;
            animation-delay: -5s;
            animation-duration: 18s;
        }

        .hero-bg-animation .shape-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(161, 140, 209, 0.3), transparent);
            top: 40%;
            left: 30%;
            animation-delay: -10s;
            animation-duration: 22s;
        }

        .hero-bg-animation .shape-4 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(244, 194, 194, 0.25), transparent);
            top: 20%;
            right: 20%;
            animation-delay: -7s;
            animation-duration: 25s;
        }

        @keyframes morphFloat {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(80px, -60px) scale(1.2) rotate(90deg); }
            50% { transform: translate(-40px, 80px) scale(0.8) rotate(180deg); }
            75% { transform: translate(60px, 40px) scale(1.1) rotate(270deg); }
        }

        /* Animated Grid Lines */
        .hero-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(0deg); }
            100% { transform: perspective(500px) rotateX(0deg) translateY(80px); }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 900px;
            padding: 0 30px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease 0.5s both;
        }

        .hero-badge .badge-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .hero-badge span {
            color: var(--champagne);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 25px;
            animation: fadeInUp 1s ease 0.8s both;
        }

        .hero-title .line-1 {
            display: block;
            color: white;
        }

        .hero-title .line-2 {
            display: block;
            background: linear-gradient(135deg, var(--gold), var(--champagne), var(--soft-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shimmerText 3s linear infinite;
        }

        .hero-title .line-3 {
            display: block;
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--soft-rose);
            font-weight: 400;
        }

        .hero-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 40px;
            animation: fadeInUp 1s ease 1.1s both;
            letter-spacing: 1px;
        }

        .hero-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: fadeInUp 1s ease 1.4s both;
            flex-wrap: wrap;
        }

        .btn-primary-hero {
            padding: 16px 45px;
            background: linear-gradient(135deg, var(--gold), #e8c547);
            color: var(--dark-elegant);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-gold);
        }

        .btn-primary-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn-primary-hero:hover::before {
            left: 100%;
        }

        .btn-primary-hero:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.5);
        }

        .btn-secondary-hero {
            padding: 16px 45px;
            background: transparent;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .btn-secondary-hero:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-3px);
        }

        /* Hero Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fadeInUp 1s ease 2s both;
        }

        .scroll-indicator span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.65rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .scroll-mouse {
            width: 26px;
            height: 42px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
