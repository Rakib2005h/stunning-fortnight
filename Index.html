<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>AuraVibe | Ultimate Luxury Lifestyle Destination</title>
<meta name="description" content="Discover premium luxury lifestyle, curated finds, exclusive deals, and daily inspiration.">
<meta name="theme-color" content="#0a0a15">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; overflow-x:hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0a0a15;
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
    line-height: 1.6;
}

/* ============ DYNAMIC MESH WALLPAPER ============ */
.wallpaper {
    position: fixed; inset: 0; z-index: -3;
    background:
        radial-gradient(at 15% 20%, #C9184A 0%, transparent 45%),
        radial-gradient(at 85% 15%, #D4AF37 0%, transparent 45%),
        radial-gradient(at 30% 75%, #764ba2 0%, transparent 45%),
        radial-gradient(at 90% 65%, #f093fb 0%, transparent 45%),
        radial-gradient(at 5% 95%, #667eea 0%, transparent 45%),
        radial-gradient(at 50% 50%, #FF6B9D 0%, transparent 40%),
        linear-gradient(135deg, #0a0a15 0%, #1a0a2e 50%, #0f0f2e 100%);
    background-size: 250% 250%;
    animation: meshShift 25s ease infinite;
    filter: saturate(1.3);
}
@keyframes meshShift {
    0%, 100% { background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%, 50% 50%, 25% 75%, 0 0; }
    25% { background-position: 100% 30%, 0% 40%, 60% 10%, 20% 90%, 90% 20%, 75% 25%, 0 0; }
    50% { background-position: 50% 100%, 70% 90%, 100% 60%, 30% 40%, 80% 30%, 100% 100%, 0 0; }
    75% { background-position: 20% 50%, 90% 100%, 30% 30%, 70% 70%, 10% 90%, 50% 0%, 0 0; }
}

/* Polythene plastic texture */
.polythene {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 5px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 8px);
    mix-blend-mode: overlay;
}
.noise {
    position: fixed; inset: 0; z-index: -1; opacity: 0.04; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Floating orbs */
.orbs { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35; }
.o1 { width:450px; height:450px; background:#C9184A; top:-120px; left:-120px; animation: of1 28s ease-in-out infinite; }
.o2 { width:400px; height:400px; background:#D4AF37; bottom:-120px; right:-120px; animation: of2 32s ease-in-out infinite; }
.o3 { width:350px; height:350px; background:#a18cd1; top:40%; left:45%; animation: of3 35s ease-in-out infinite; }
.o4 { width:300px; height:300px; background:#f093fb; top:60%; right:20%; animation: of4 40s ease-in-out infinite; }
@keyframes of1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(250px,350px) scale(1.4);} }
@keyframes of2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-300px,-250px) scale(1.5);} }
@keyframes of3 { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-20%,-80%) scale(1.6);} }
@keyframes of4 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-200px,-300px) scale(1.3);} }

/* Sparkle particles */
.sparkle {
    position: fixed; width: 3px; height: 3px;
    background: white; border-radius: 50%;
    box-shadow: 0 0 10px white; pointer-events: none; z-index: 1;
    animation: sparkleFly linear infinite;
}
@keyframes sparkleFly {
    0% { transform: translateY(100vh); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* ============ NAVIGATION ============ */
.nav {
    position: fixed; top: 12px; left: 12px; right: 12px;
    padding: 12px 22px;
    background: rgba(15,15,30,0.5);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px; z-index: 1000;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}
.logo {
    font-size: 1.4rem; font-weight: 900; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #D4AF37, #F7E7CE, #F4C2C2);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
}
.logo b { color: #D4AF37; -webkit-text-fill-color: #D4AF37; }

.nav-menu { display: flex; gap: 6px; align-items: center; }
.nav-menu a {
    color: rgba(255,255,255,0.7); text-decoration: none;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; padding: 8px 14px;
    border-radius: 100px; transition: all 0.3s;
    display: none;
}
.nav-menu a:hover { color: #D4AF37; background: rgba(212,175,55,0.1); }
.nav-menu a.cta {
    display: block;
    padding: 9px 22px;
    background: linear-gradient(135deg, #D4AF37, #e8c547);
    color: #1a1a2e; font-weight: 800;
    box-shadow: 0 4px 15px rgba(212,175,55,0.4);
}
.nav-menu a.cta:hover { transform: translateY(-2px); }

@media (min-width: 768px) {
    .nav-menu a { display: block; }
}

/* ============ HERO ============ */
.hero {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 100px 20px 60px; text-align: center; position: relative;
}
.hero-content { max-width: 900px; position: relative; z-index: 2; }

.hero-badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 24px;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(15px);
    border: 1px solid rgba(212,175,55,0.3); border-radius: 100px;
    margin-bottom: 28px; animation: fadeDown 1s ease;
}
.hero-badge::before {
    content: ''; width: 8px; height: 8px; background: #4ade80;
    border-radius: 50%; box-shadow: 0 0 12px #4ade80;
    animation: pulseGreen 2s infinite;
}
.hero-badge span {
    color: #F7E7CE; font-size: 0.7rem; letter-spacing: 2.5px;
    text-transform: uppercase; font-weight: 500;
}
@keyframes pulseGreen { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.4);opacity:0.6;} }

.hero h1 {
    font-size: clamp(2.5rem, 9vw, 5.5rem);
    font-weight: 900; line-height: 1; margin-bottom: 24px;
    letter-spacing: -2px; animation: fadeUp 1s ease 0.3s both;
}
.hero h1 .l1 { color: white; display: block; }
.hero h1 .l2 {
    background: linear-gradient(135deg, #D4AF37 0%, #F7E7CE 25%, #F4C2C2 50%, #C9184A 75%, #D4AF37 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    display: block; animation: shimmerT 3s linear infinite;
}
.hero h1 .l3 {
    display: block; font-size: 0.45em; font-weight: 300;
    font-style: italic; color: rgba(255,255,255,0.6);
    margin-top: 12px; letter-spacing: 0;
}
@keyframes shimmerT { to { background-position: 200% center; } }

.hero p {
    color: rgba(255,255,255,0.7); font-size: clamp(1rem, 3vw, 1.2rem);
    max-width: 600px; margin: 0 auto 36px; line-height: 1.7;
    animation: fadeUp 1s ease 0.6s both;
}
.hero-buttons {
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    animation: fadeUp 1s ease 0.9s both; margin-bottom: 40px;
}

.btn {
    padding: 15px 34px; border-radius: 100px; font-size: 0.78rem;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    text-decoration: none; cursor: pointer; border: none;
    transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    position: relative; overflow: hidden; display: inline-block;
}
.btn-gold {
    background: linear-gradient(135deg, #D4AF37, #e8c547);
    color: #1a1a2e; box-shadow: 0 10px 30px rgba(212,175,55,0.4);
}
.btn-gold::before {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    transition: left 0.6s;
}
.btn-gold:hover::before { left: 100%; }
.btn-gold:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212,175,55,0.6); }

.btn-glass {
    background: rgba(255,255,255,0.05); backdrop-filter: blur(15px);
    color: white; border: 1px solid rgba(255,255,255,0.2);
}
.btn-glass:hover {
    background: rgba(255,255,255,0.1); border-color: #D4AF37;
    color: #D4AF37; transform: translateY(-3px);
}

/* Trust bar */
.trust-bar {
    display: flex; justify-content: center; align-items: center;
    gap: 30px; flex-wrap: wrap; margin-top: 40px;
    animation: fadeUp 1s ease 1.2s both;
}
.trust-item {
    display: flex; align-items: center; gap: 8px;
    color: rgba(255,255,255,0.5); font-size: 0.8rem;
}
.trust-item strong { color: #D4AF37; font-weight: 800; font-size: 1.1rem; }

.scroll-hint {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: fadeUp 1s ease 1.5s both;
}
.scroll-mouse {
    width: 24px; height: 38px; border: 2px solid rgba(255,255,255,0.3);
    border-radius: 15px; position: relative;
}
.scroll-mouse::after {
    content: ''; width: 3px; height: 8px; background: #D4AF37;
    border-radius: 3px; position: absolute; top: 6px; left: 50%;
    transform: translateX(-50%); animation: scrollDot 2s ease-in-out infinite;
}
.scroll-hint span {
    color: rgba(255,255,255,0.4); font-size: 0.6rem;
    letter-spacing: 3px; text-transform: uppercase;
}
@keyframes scrollDot { 0%{top:6px;opacity:1;} 100%{top:22px;opacity:0;} }

/* ============ MARQUEE ============ */
.marquee {
    padding: 22px 0; background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px); border-top: 1px solid rgba(212,175,55,0.15);
    border-bottom: 1px solid rgba(212,175,55,0.15);
    overflow: hidden; position: relative; z-index: 2;
}
.marquee-track { display: flex; width: max-content; animation: marqMove 30s linear infinite; }
.mq { display: flex; align-items: center; gap: 14px; padding: 0 36px; white-space: nowrap; }
.mq span {
    color: #F7E7CE; font-size: 0.85rem; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 500;
}
.mq .dot { width: 5px; height: 5px; background: #D4AF37; border-radius: 50%; opacity: 0.5; }
@keyframes marqMove { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

/* ============ SECTIONS ============ */
.section {
    padding: 80px 20px; max-width: 1350px; margin: 0 auto;
    position: relative; z-index: 2;
}
.section-head { text-align: center; margin-bottom: 55px; }

.section-tag {
    display: inline-block; padding: 6px 18px;
    background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
    border-radius: 100px; color: #D4AF37; font-size: 0.65rem;
    letter-spacing: 3px; text-transform: uppercase; font-weight: 700;
    margin-bottom: 16px;
}
.section-title {
    font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 900;
    letter-spacing: -1px; line-height: 1.1; margin-bottom: 16px; color: white;
}
.section-title .grad {
    background: linear-gradient(135deg, #C9184A, #D4AF37);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
}
.section-desc {
    color: rgba(255,255,255,0.6); max-width: 560px; margin: 0 auto;
    font-size: 1.05rem; line-height: 1.7;
}

/* ============ ABOUT BOX ============ */
.about-box {
    background: rgba(255,255,255,0.04); backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
    padding: 50px 30px; text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.35); position: relative; overflow: hidden;
}
.about-box::before {
    content: ''; position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent 0%, rgba(212,175,55,0.1) 25%, transparent 50%);
    animation: rotate360 15s linear infinite; z-index: -1;
}
@keyframes rotate360 { to { transform: rotate(360deg); } }

.about-emoji {
    font-size: 3.5rem; margin-bottom: 20px; display: inline-block;
    animation: floatY 3s ease-in-out infinite;
}
@keyframes floatY { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-15px) rotate(5deg);} }

.about-box h2 {
    font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 900;
    margin-bottom: 20px; color: white;
}
.about-box h2 em {
    background: linear-gradient(135deg, #C9184A, #D4AF37);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; font-style: italic;
}
.about-box > p {
    color: rgba(255,255,255,0.7); max-width: 650px; margin: 0 auto 40px;
    font-size: 1.05rem; line-height: 1.8;
}

.stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    max-width: 800px; margin: 0 auto;
}
@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } }

.stat {
    background: rgba(255,255,255,0.03); backdrop-filter: blur(10px);
    border: 1px solid rgba(212,175,55,0.15); padding: 22px 12px;
    border-radius: 18px; transition: all 0.4s;
}
.stat:hover {
    transform: translateY(-5px); border-color: rgba(212,175,55,0.4);
    background: rgba(255,255,255,0.06);
}
.stat-num {
    font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 900;
    background: linear-gradient(135deg, #D4AF37, #F7E7CE);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
}
.stat-label {
    font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.5); margin-top: 6px;
}

/* ============ CATEGORY GRID ============ */
.categories {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px; max-width: 1200px; margin: 0 auto;
}
.cat-item {
    background: rgba(255,255,255,0.05); backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
    padding: 30px 20px; text-align: center; cursor: pointer;
    transition: all 0.4s; text-decoration: none; color: white;
}
.cat-item:hover {
    transform: translateY(-8px); border-color: #D4AF37;
    background: rgba(212,175,55,0.1);
    box-shadow: 0 15px 40px rgba(212,175,55,0.2);
}
.cat-emoji { font-size: 2.5rem; margin-bottom: 12px; display: block; }
.cat-item h4 {
    font-size: 0.9rem; font-weight: 800; margin-bottom: 4px;
    letter-spacing: 0.5px;
}
.cat-item p {
    font-size: 0.7rem; color: rgba(255,255,255,0.5);
    letter-spacing: 1.5px; text-transform: uppercase;
}

/* ============ QUIZ ============ */
.quiz-box {
    max-width: 780px; margin: 0 auto;
    background: rgba(255,255,255,0.04); backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 28px;
    padding: 40px 26px; box-shadow: 0 25px 70px rgba(0,0,0,0.35);
}
.progress { display: flex; gap: 8px; margin-bottom: 32px; }
.progress-bar {
    flex: 1; height: 4px; background: rgba(255,255,255,0.08);
    border-radius: 10px; overflow: hidden;
}
.progress-bar.active {
    background: linear-gradient(90deg, #D4AF37, #F4C2C2);
    box-shadow: 0 0 10px rgba(212,175,55,0.5);
}
.question {
    font-size: clamp(1.2rem, 4vw, 1.7rem); font-weight: 800;
    text-align: center; margin-bottom: 30px; line-height: 1.4; color: white;
}
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 500px) { .options { grid-template-columns: 1fr; } }

.option {
    padding: 18px 20px; background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1); border-radius: 16px;
    color: rgba(255,255,255,0.85); font-size: 0.9rem; font-weight: 500;
    cursor: pointer; transition: all 0.3s; display: flex;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
}
.option:hover {
    background: rgba(212,175,55,0.15); border-color: rgba(212,175,55,0.5);
    color: white; transform: translateY(-3px);
}
.option.picked {
    background: linear-gradient(135deg, rgba(212,175,55,0.3), rgba(201,24,74,0.3));
    border-color: #D4AF37; color: white;
    box-shadow: 0 8px 20px rgba(212,175,55,0.3);
}
.option .em { font-size: 1.4rem; }
.quiz-step { display: none; }
.quiz-step.active { display: block; animation: fadeUp 0.5s ease; }
.quiz-result { display: none; text-align: center; padding: 10px 0; }
.quiz-result.show { display: block; animation: fadeUp 0.6s ease; }
.result-icon { font-size: 4rem; margin-bottom: 16px; display: inline-block; animation: bounce 0.6s ease; }
@keyframes bounce { 0%{transform:scale(0);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }
.result-title {
    font-size: 1.8rem; font-weight: 900;
    background: linear-gradient(135deg, #D4AF37, #F7E7CE);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; margin-bottom: 14px;
}
.result-desc {
    color: rgba(255,255,255,0.7); margin-bottom: 26px;
    max-width: 500px; margin-left: auto; margin-right: auto; line-height: 1.7;
}

/* ============ SHOP CARDS ============ */
.shop-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
}
.card {
    background: rgba(255,255,255,0.04); backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
    overflow: hidden; transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
    cursor: pointer; position: relative;
}
.card:hover {
    transform: translateY(-10px); border-color: rgba(212,175,55,0.4);
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
}
.card-img {
    height: 240px; display: flex; align-items: center; justify-content: center;
    font-size: 5.5rem; position: relative; overflow: hidden;
}
.card:nth-child(1) .card-img { background: linear-gradient(135deg, #C9184A, #f093fb); }
.card:nth-child(2) .card-img { background: linear-gradient(135deg, #D4AF37, #F7E7CE); }
.card:nth-child(3) .card-img { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
.card:nth-child(4) .card-img { background: linear-gradient(135deg, #667eea, #764ba2); }
.card:nth-child(5) .card-img { background: linear-gradient(135deg, #f5576c, #f093fb); }
.card:nth-child(6) .card-img { background: linear-gradient(135deg, #FA8BFF, #2BD2FF); }
.card:nth-child(7) .card-img { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
.card:nth-child(8) .card-img { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
.card:nth-child(9) .card-img { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
.card:nth-child(10) .card-img { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
.card:nth-child(11) .card-img { background: linear-gradient(135deg, #ff6e7f, #bfe9ff); }
.card:nth-child(12) .card-img { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }

.card-img::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 4px);
}
.card-tag {
    position: absolute; top: 14px; left: 14px; padding: 6px 12px;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
    border-radius: 100px; font-size: 0.65rem; font-weight: 800;
    letter-spacing: 1.5px; text-transform: uppercase; color: #C9184A; z-index: 2;
}
.card-heart {
    position: absolute; top: 14px; right: 14px; width: 38px; height: 38px;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
    border: none; border <!-- SHOP -->
<section class="section" id="shop">
    <div class="section-head">
        <div class="section-tag">Handpicked For You</div>
        <h2 class="section-title">Today's <span class="grad">Curated Picks</span></h2>
        <p class="section-desc">Premium finds our editors selected just for you</p>
    </div>
    <div class="shop-grid">
        <div class="card">
            <div class="card-img">👗
                <div class="card-tag">✨ Editor's Pick</div>
